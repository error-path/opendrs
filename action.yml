name: opendrs Diff Risk Score
description: Diff Risk Score for pull requests. Comments a calibrated 0-1 risk score, labels the PR, and can approve low-risk PRs.
author: error-path
branding:
  icon: shield
  color: green

inputs:
  github-token:
    description: Token for the GitHub API. Needs pull-requests write (comment, labels, approval) and checks read.
    required: false
    default: ${{ github.token }}
  base-config:
    description: Read .opendrs.yml and the calibrated model from the PR's base commit, so a PR cannot loosen its own gate. Keep this true. Even when false, the llm section and the model path always come from the base commit.
    required: false
    default: "true"
  llm-api-key:
    description: API key for the optional LLM judge, exported as ANTHROPIC_API_KEY or OPENAI_API_KEY (or llm.apiKeyEnv). Used only when llm.enabled is true in the config.
    required: false
    default: ""
  comment:
    description: Create or update one PR comment with the risk report.
    required: false
    default: "true"
  labels:
    description: Set one of the risk:green, risk:yellow or risk:red labels, and (when captain.enabled) one of captain:careful, captain:standard or captain:quick.
    required: false
    default: "true"
  sample-salt:
    description: Set this to a secret whenever autoApprove is enabled. It is mixed into the per-PR key that picks which eligible PRs still go to a human (autoApprove.sampleRate). With the default empty salt, sampling is predictable - anyone can compute which PR numbers are sampled - and the Action logs a warning.
    required: false
    default: ""
  brief:
    description: Build the review brief (ranked hunks, check questions, safe-to-skim, hard-rule reasons) and add it to the PR comment, the job summary and the brief/brief-file outputs. Set to false to keep today's comment layout byte for byte.
    required: false
    default: "true"
  notify-changes:
    description: When to post a one-line comment with the new score and a link to the updated report. every-push (default) posts after each push, and after a re-run that changes the tier or the decision; on-change posts only when the tier or the decision changed; false never posts. true means every-push. Needs brief and comment to both be true; otherwise nothing is posted.
    required: false
    default: "every-push"

outputs:
  score:
    description: Risk score between 0 and 1.
  tier:
    description: green, yellow or red.
  decision:
    description: auto-approve, deferred-review, waiting-ai-review or human-review. This is the policy decision; the PR is approved only when autoApprove.enabled is true, every safety rail passes and any landing delay has run. On a schedule or workflow_dispatch sweep, the outputs are those of the last PR swept.
  captain:
    description: How much attention the captain (the final human reviewer) should give this PR - careful, standard or quick. Empty when captain.enabled is false or the brief input is false.
  brief:
    description: The review brief as Markdown (the same text shown in the PR comment's collapsed "Review brief for AI reviewers" section). Empty when the brief input is false.
  brief-file:
    description: Path to the review brief as JSON, written under $RUNNER_TEMP. Empty when the brief input is false.

runs:
  using: node24
  main: action/dist/index.js
