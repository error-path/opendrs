title: opendrs
tagline: "PR blast radius analyzer and risk score for safe auto-approval"
description: "Open-source PR blast radius analyzer: a calibrated 0-1 risk score for every pull request, so AI-reviewed, low-risk PRs can be auto-approved into the merge queue while risky ones wait for a human. GitHub Action, CLI, Claude Code plugin and MCP server."
