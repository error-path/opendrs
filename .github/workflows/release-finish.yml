name: Finish a release

# Run by hand after you approve a staged npm version: publishes server.json to the MCP registry,
# moves the major tag (v0) to the release so `@v0` users get it, and opens one PR, as opendrs-bot
# so CI runs on it, that pins the Claude Code plugin and this repository's own opendrs step to the
# release. Only the repository owner can run it. The registry login uses the run's OIDC token; the
# only stored secret is the opendrs-bot key, used in the pins job alone. See docs/maintaining.md,
# "Releasing".
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag that npm already serves, such as v0.6.0"
        required: true
      move-major-tag:
        description: "Move the major tag (v0) to this release. Untick for a release with a breaking change: release v1 instead."
        type: boolean
        default: true

permissions: {}

# Never cancel a publish halfway; a second run waits.
concurrency:
  group: release-finish
  cancel-in-progress: false

jobs:
  check:
    name: Check the release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TAG: ${{ inputs.tag }}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check who started the run
        env:
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          OWNER: ${{ github.repository_owner }}
        run: |
          # GitHub lets anyone with write access run a workflow; this one publishes, so only the owner.
          test "$TRIGGERING_ACTOR" = "$OWNER" \
            || { echo "::error::Only $OWNER can finish a release, not $TRIGGERING_ACTOR"; exit 1; }
      - name: Check the tag name
        run: |
          # [[ =~ ]] matches the whole value; grep would pass a value with one good line.
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$TAG' is not a release tag like v1.2.3"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0 # the next step needs main's history
          persist-credentials: false
      - name: Check that the tag is on main and matches package.json and server.json
        id: version
        run: |
          git merge-base --is-ancestor HEAD origin/main \
            || { echo "::error::$TAG is not on main"; exit 1; }
          VERSION=$(node -p 'require("./package.json").version')
          test "v$VERSION" = "$TAG" \
            || { echo "::error::$TAG does not match package.json version $VERSION"; exit 1; }
          test "$(node -p 'require("./server.json").version')" = "$VERSION" \
            || { echo "::error::server.json's version is not $VERSION"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Check that npm serves the version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # The registry refuses a version npm does not have, and the plugin pin would install nothing.
          npm view "@error-path/opendrs@$VERSION" version 2>/dev/null | grep -qx "$VERSION" \
            || { echo "::error::npm does not serve $VERSION yet: approve the staged version first"; exit 1; }

  registry:
    name: Publish to the MCP registry
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # the OIDC token the registry checks for the io.github.error-path namespace
    env:
      TAG: ${{ inputs.tag }}
      VERSION: ${{ needs.check.outputs.version }}
      # Update both together, from the release's mcp-publisher_linux_amd64.tar.gz digest.
      PUBLISHER_VERSION: "1.8.9"
      PUBLISHER_SHA256: 4d527ca8f1ced0394c962dc925c2a4a4addef441cbefd62501c875e9481823a8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - name: Skip a version the registry already has
        id: listed
        run: |
          NAME=$(node -p 'encodeURIComponent(require("./server.json").name)')
          STATUS=$(curl -sS -o /dev/null -w '%{http_code}' "https://registry.modelcontextprotocol.io/v0/servers/$NAME/versions/$VERSION")
          case "$STATUS" in
            200) echo "The registry already lists $VERSION; nothing to publish." | tee -a "$GITHUB_STEP_SUMMARY"
                 echo "skip=true" >> "$GITHUB_OUTPUT" ;;
            404) ;;
            *) echo "::error::The registry answered $STATUS"; exit 1 ;;
          esac
      - name: Install mcp-publisher
        if: steps.listed.outputs.skip != 'true'
        run: |
          curl -fsSL -o "$RUNNER_TEMP/mcp-publisher.tar.gz" \
            "https://github.com/modelcontextprotocol/registry/releases/download/v$PUBLISHER_VERSION/mcp-publisher_linux_amd64.tar.gz"
          echo "$PUBLISHER_SHA256  $RUNNER_TEMP/mcp-publisher.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/mcp-publisher.tar.gz" -C "$RUNNER_TEMP" mcp-publisher
      - name: Publish
        if: steps.listed.outputs.skip != 'true'
        run: |
          "$RUNNER_TEMP/mcp-publisher" login github-oidc
          "$RUNNER_TEMP/mcp-publisher" publish
          echo "### Published $VERSION to the MCP registry" >> "$GITHUB_STEP_SUMMARY"

  major-tag:
    name: Move the major tag
    needs: [check, registry]
    # A prerelease never moves it; untick the input for a breaking change.
    if: inputs.move-major-tag && !contains(inputs.tag, '-')
    runs-on: ubuntu-latest
    permissions:
      contents: write # to force-push the major tag
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
      - name: Move the major tag to the release commit
        run: |
          MAJOR="${TAG%%.*}" # v0.7.1 -> v0
          git tag -f "$MAJOR" "$(git rev-parse "refs/tags/$TAG^{commit}")"
          git push -f origin "refs/tags/$MAJOR"
          echo "### Moved $MAJOR to $TAG" >> "$GITHUB_STEP_SUMMARY"

  pins:
    name: Open the release pins PR
    needs: [check, registry]
    runs-on: ubuntu-latest
    permissions:
      contents: read # the push and the PR use the opendrs-bot token, so CI runs on the PR
    env:
      TAG: ${{ inputs.tag }}
      VERSION: ${{ needs.check.outputs.version }}
      BRANCH: chore/release-pins-${{ needs.check.outputs.version }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0 # to read the tag's commit
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # release.mjs imports only Node's own modules, and nothing is installed in this job.
      - name: Pin the plugin and the dogfood action
        id: pin
        run: |
          node scripts/release.mjs pin-plugin "$VERSION"
          node scripts/release.mjs pin-dogfood "$VERSION" "$(git rev-parse "refs/tags/$TAG^{commit}")"
          if git diff --quiet; then
            echo "main already pins $VERSION; no PR to open." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Mint an opendrs-bot token
        id: app-token
        if: steps.pin.outputs.skip != 'true'
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.OPENDRS_APP_CLIENT_ID }}
          private-key: ${{ secrets.OPENDRS_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Push the branch and open the PR
        if: steps.pin.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git switch -c "$BRANCH"
          git -c user.name="opendrs-bot[bot]" -c user.email="opendrs-bot[bot]@users.noreply.github.com" \
            commit -am "chore(release): pin the plugin and this repository's opendrs to $VERSION"
          git push "https://x-access-token:$GH_TOKEN@github.com/$REPOSITORY.git" "HEAD:refs/heads/$BRANCH"
          URL=$(gh pr create --repo "$REPOSITORY" --base main --head "$BRANCH" \
            --title "chore(release): pin the plugin and this repository's opendrs to $VERSION" \
            --body "Opened by **Finish a release** for $TAG: npm serves $VERSION and the MCP registry lists it. Pins the Claude Code plugin's npx calls and the dogfood action (.github/actions/opendrs-release) to the release. Merge when CI passes.")
          echo "### Pins PR opened: $URL" >> "$GITHUB_STEP_SUMMARY"
