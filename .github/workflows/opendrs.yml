# Dogfood: score this repository's own PRs and approve the low-risk ones (.opendrs.yml), and
# auto-merge only those that are also a captain "quick confirm", once the required checks pass.
# Runs a RELEASED action, pinned to a release commit that Dependabot bumps, never the PR's own
# copy: a PR must not be able to edit the code that decides whether to approve it.
name: OpenDRS

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]

# A newer push cancels the run for the older head, so it cannot approve or merge a stale commit.
concurrency:
  group: opendrs-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  opendrs:
    name: Score, label and approve
    runs-on: ubuntu-latest
    # GITHUB_TOKEN only checks out and, on fork PRs, comments; the opendrs-bot app token below does
    # the rest, including enabling auto-merge. Write access is granted here, not at the top level.
    permissions:
      contents: read
      pull-requests: write
      checks: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # required: the score reads past commits, authors and the merge-base
      # opendrs comments, labels, approves and merges as the opendrs-bot GitHub App, not as
      # github-actions. The token lasts one hour, covers this repository only and is revoked when
      # the job ends. Fork PRs get no secrets: they fall back to GITHUB_TOKEN and are never approved.
      - name: Mint an opendrs-bot token
        id: app-token
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.OPENDRS_APP_CLIENT_ID }}
          private-key: ${{ secrets.OPENDRS_APP_PRIVATE_KEY }}
      - uses: error-path/opendrs@541a0cf40f50de3b6b7d25ddf280bc05f6e7dd81 # v0.7.1
        id: opendrs
        with:
          github-token: ${{ steps.app-token.outputs.token || github.token }}
          sample-salt: ${{ secrets.OPENDRS_SAMPLE_SALT }}
      - env:
          SCORE: ${{ steps.opendrs.outputs.score }}
          TIER: ${{ steps.opendrs.outputs.tier }}
          DECISION: ${{ steps.opendrs.outputs.decision }}
          CAPTAIN: ${{ steps.opendrs.outputs.captain }}
        run: echo "score=$SCORE tier=$TIER decision=$DECISION captain=$CAPTAIN"
      # Approval and captain come from this run, never from labels: anyone with triage access can add
      # a label. `approved` is set only after every safety rail passed; `decision` is the policy
      # verdict before them, so a PR the self-modification guard refused still reads auto-approve.
      - name: Auto-merge an approved, quick-confirm PR once the required checks pass
        if: steps.app-token.outputs.token != '' && steps.opendrs.outputs.approved == 'true' && steps.opendrs.outputs.captain == 'quick'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr merge "$PR" --auto --squash --repo "$GITHUB_REPOSITORY"
      # Turn it off in every other case, including a failed opendrs step, so a later push that is no
      # longer quick-confirm cannot merge on auto-merge set by an earlier run.
      - name: Otherwise turn auto-merge off
        if: ${{ !cancelled() && !(steps.opendrs.outputs.approved == 'true' && steps.opendrs.outputs.captain == 'quick') }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr merge "$PR" --disable-auto --repo "$GITHUB_REPOSITORY" || true
