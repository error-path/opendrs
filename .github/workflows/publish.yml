name: publish

# Publishes the package to npm when a GitHub release is published, with npm trusted publishing:
# npm checks this workflow's OIDC token instead of a stored npm token, and adds provenance.
# Setup and recovery: docs/maintaining.md, "Releasing".
on:
  release:
    types: [published]
  # Re-run a publish that failed, such as while npm was down: give the release tag.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, such as v0.5.2"
        required: true

permissions:
  contents: read

# Never cancel a publish halfway; a second one waits.
concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # npm's trusted publisher entry names this environment. Add required reviewers to it in the
    # repository settings to approve each publish by hand.
    environment: npm
    permissions:
      contents: read
      id-token: write # the OIDC token npm trusted publishing checks
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Check the tag name
        run: |
          # [[ =~ ]] matches the whole value; grep would pass a value with one good line.
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$TAG' is not a release tag like v1.2.3"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0 # the next step needs main's history
          persist-credentials: false
      - name: Check that the tag is on main and matches package.json
        run: |
          git merge-base --is-ancestor HEAD origin/main \
            || { echo "::error::$TAG is not on main"; exit 1; }
          VERSION=$(node -p 'require("./package.json").version')
          test "v$VERSION" = "$TAG" \
            || { echo "::error::$TAG does not match package.json version $VERSION"; exit 1; }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Check that npm supports trusted publishing (11.5.1 or later)
        run: |
          npm --version
          node -e 'const [a,b,c]=process.argv[1].split(".").map(Number); process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)' "$(npm --version)" \
            || { echo "::error::npm $(npm --version) is too old for trusted publishing"; exit 1; }
      - name: Skip a version npm already has
        id: published
        run: |
          if npm view "@error-path/opendrs@$VERSION" version 2>/dev/null | grep -qx "$VERSION"; then
            echo "npm already has $VERSION; nothing to publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.published.outputs.skip != 'true'
        run: npm ci
      - if: steps.published.outputs.skip != 'true'
        run: npm run typecheck
      - if: steps.published.outputs.skip != 'true'
        run: npm test
      - name: Publish
        if: steps.published.outputs.skip != 'true'
        run: |
          # A prerelease (1.2.3-rc.1) goes to the "next" dist-tag, so `npm i` keeps installing the
          # latest stable version.
          case "$VERSION" in
            *-*) npm publish --tag next ;;
            *) npm publish ;;
          esac
