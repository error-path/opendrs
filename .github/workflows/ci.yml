name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # The job id `check` gives the check names `check (22)` and `check (24)`, which the main
  # ruleset requires: renaming it blocks every merge.
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:slow
      - run: npm run build
      - run: npm run build:action
      - name: Check that the committed action bundle is up to date
        run: test -z "$(git status --porcelain action/dist)"
